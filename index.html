<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Simple Todo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="hero">
        <div class="brand">
            <h1>TaskFlow</h1>
        </div>
        <h1>Todays work</h1>
        <p>Manage Your Daily Tasks</p>
    </header>
    
    <main class="app">
        <form id="f" class="composer">
            <input id="i" placeholder="নতুন কাজ লেখো..." required />
            <button type="submit">+ Add</button>
        </form>
        
        <ul id="list" class="list"></ul>
        
        <div class="stats">
            <span id="count">0 tasks - 0 done</span> 
            <button id="clear">Clear done</button>
        </div>
    </main>
    
    <footer>© TaskFlow 2026. Tip: item text click করলে done toggle</footer>
    
    <script src="app.js"></script>
</body>
</html>
